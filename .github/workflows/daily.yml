name: WorkBuddy 每日签到与派猫

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 签到 + 派猫 + 领旅行积分
        env:
          WORKBUDDY_TOKEN: ${{ secrets.WORKBUDDY_TOKEN }}
          WORKBUDDY_UID: ${{ secrets.WORKBUDDY_UID }}
        run: python workbuddy_points.py --mode all
